# Compilation Android automatisée du prototype Godot d'OKÉLUN.
# Produit un APK de debug signé avec une clé de debug générée à chaque exécution.
# Procédure complète : game/ANDROID_BUILD.md
name: Android build (Godot)

on:
  push:
    # version/vX.Y.Z : branches figées d'une version (points de restauration).
    branches: ["godot/**", "main", "version/**"]
    # Tag vX.Y.Z créé depuis GitHub : l'APK est en plus publié dans une release.
    # Si un tag ne déclenche pas la compilation, la lancer à la main (Run workflow) sur ce tag.
    tags: ["v*"]
    paths: ["game/**", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["game/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"
  GODOT_RELEASE: "stable"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot et modèles d'export
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Installer Godot et les modèles d'export
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${TAG}"
          mkdir -p ~/godot-cache && cd ~/godot-cache
          [ -s godot.zip ] || curl -fsSL -o godot.zip "${BASE}/Godot_v${TAG}_linux.x86_64.zip"
          [ -s templates.tpz ] || curl -fsSL -o templates.tpz "${BASE}/Godot_v${TAG}_export_templates.tpz"
          unzip -o -q godot.zip -d ~/godot-bin
          mkdir -p ~/.local/bin
          install -m 755 ~/godot-bin/Godot_v${TAG}_linux.x86_64 ~/.local/bin/godot
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$TPL_DIR" /tmp/godot-templates
          unzip -o -q templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. "$TPL_DIR"/
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ls "$TPL_DIR" | grep -E '^android_(debug|release)\.apk$'

      - name: Configurer le SDK Android et la clé de debug
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ls "$SDK/build-tools"
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          SHORT="${GODOT_VERSION%.*}"
          mkdir -p ~/.config/godot
          for f in "editor_settings-4.tres" "editor_settings-${SHORT}.tres"; do
            cat > ~/.config/godot/"$f" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Importer le projet (détecte les erreurs de script)
        run: |
          set -o pipefail
          godot --headless --path game --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::Erreurs de script détectées pendant l'import"; exit 1
          fi

      - name: Test de fumée (scène principale, 120 frames)
        run: |
          set -o pipefail
          timeout 120 godot --headless --path game -- --smoke-test 2>&1 | tee smoke.log
          grep -q "SMOKE TEST OK" smoke.log
          if grep -E "SCRIPT ERROR" smoke.log; then exit 1; fi

      - name: Tests de gameplay (déplacement, attaques, défense, victoire, IA)
        run: |
          set -o pipefail
          timeout 300 godot --headless --path game --fixed-fps 60 res://tests/test_runner.tscn 2>&1 | tee gameplay-tests.log
          grep -q "^TESTS OK" gameplay-tests.log
          if grep -E "SCRIPT ERROR|Parse Error" gameplay-tests.log; then exit 1; fi

      - name: Nommer l'APK selon la version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version\/name="\(.*\)"$/\1/p' game/export_presets.cfg)
          CODE=$(sed -n 's/^version\/code=\(.*\)$/\1/p' game/export_presets.cfg)
          case "$GITHUB_REF" in
            refs/tags/v*)
              LABEL="$GITHUB_REF_NAME"
              if [ "$LABEL" != "v$VERSION" ]; then
                echo "::error::Le tag $LABEL ne correspond pas à la version du projet (v$VERSION)"; exit 1
              fi
              RETENTION=90 ;;
            refs/heads/version/v*)
              LABEL="${GITHUB_REF_NAME#version/}"
              RETENTION=90 ;;
            *)
              LABEL="v${VERSION}-dev-${GITHUB_SHA::7}"
              RETENTION=14 ;;
          esac
          echo "APK_NAME=okelun-${LABEL}-debug.apk" >> "$GITHUB_ENV"
          echo "APK_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "APK_RETENTION=$RETENTION" >> "$GITHUB_ENV"
          echo "Version du projet : $VERSION (code $CODE) ; APK : okelun-${LABEL}-debug.apk ; conservation $RETENTION jours"

      - name: Exporter l'APK de debug
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/build/$APK_NAME" 2>&1 | tee export.log
          test -s "build/$APK_NAME"
          ls -l "build/$APK_NAME"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: okelun-${{ env.APK_LABEL }}-debug
          path: build/${{ env.APK_NAME }}
          retention-days: ${{ env.APK_RETENTION }}
          if-no-files-found: error

      - name: Publier la release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/$APK_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "OKÉLUN $GITHUB_REF_NAME — prototype Android (debug)" \
            --notes "APK de debug produit et testé automatiquement par la CI (tests de gameplay sans écran). Non vérifié sur téléphone au moment de la publication."

      - name: Publier les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs-${{ github.sha }}
          path: "*.log"
          if-no-files-found: ignore
